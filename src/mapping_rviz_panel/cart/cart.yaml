# ขนาดรถกอล์ฟที่ใช้วาดโมเดลใน RViz (หน่วยเมตร) อ่านใหม่ทุกครั้งที่เปิด
# mapping_panel.launch.py — แก้ไฟล์นี้แล้ว colcon build --packages-select mapping_rviz_panel
#
# ที่มาของตัวเลข:
#   [วัด]    วัดจากรถจริง หรือคำนวณจากแผนที่ที่เก็บเมื่อ 2026-10-07 (1212 keyframe, 1 กม.)
#   [ทีม]    ค่าที่ใช้อยู่แล้วใน golfcart_low_level (cart_marker.py)
#   [ทั่วไป] ขนาดรถกอล์ฟทั่วไป ยังไม่ได้วัดกับคันนี้ — วัดแล้วมาแก้ได้

wheelbase: 1.65          # [วัด] ระยะเพลาหน้า-หลัง (wheelbase_m ใน golfcart_low_level.yaml)
length: 2.8              # [ทีม] ยาวสุดกันชนหน้าถึงที่พักเท้าหลัง
width: 1.3               # [ทีม] กว้างสุดขอบยางซ้าย-ขวา
front_overhang: 0.40     # [ทั่วไป] เพลาหน้าถึงปลายกันชนหน้า
tire_diameter: 0.457     # [ทั่วไป] ยาง 18x8.5-8
tire_width: 0.216
roof_length: 2.05        # [ทั่วไป]
roof_front: 1.42         # [ทั่วไป] ขอบหน้าหลังคา วัดจากเพลาหลังไปข้างหน้า

# ตำแหน่ง lidar บนรถ: โมเดลถูกแขวนไว้กับเฟรม lidar_link ด้วยค่าพวกนี้ ถ้าผิด
# ล้อจะลอยหรือจมพื้น หรือรถจะเลื่อนหน้า-หลังจากตำแหน่งจริง
lidar:
  ahead_of_rear_axle: 1.53   # [วัด] จากการเลี้ยว 122 ช่วง (ส่ายข้าง = อัตราเลี้ยว x ระยะนี้) คลาดเคลื่อน ~0.04
  height: 1.80               # [วัด] สูงจากพื้น: เทียบกับพื้นในแผนที่รอบ 202 keyframe ได้ 1.78 และเมื่อ
                             #       วางโมเดลด้วยค่านั้น ล้อทั้งสี่ลอยเหนือพื้นในแผนที่ 3-4 ซม. เท่ากันทุกล้อ
  forward: -x                # [วัด] รถวิ่งไปทาง -x ของ lidar_link ทุกช่วง (point cloud อยู่ในเฟรม os_lidar)
  roll_deg: 0.8              # [วัด] lidar เอียงจากแนวระดับ (ค่ากลางตลอดเส้นทาง) ใช้ตั้งรถให้ขนานพื้น
  pitch_deg: -1.5
